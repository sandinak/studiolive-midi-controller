name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # node-gyp needs distutils to build @julusian/midi; Python 3.12+ removed it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Node 22 ships npm 10.9, whose resolver crashes with "Cannot read
      # properties of null (reading 'edgesOut')" on the upstream dependency
      # tree. This began failing both jobs after v1.4.2; npm 11 resolves it.
      - name: Use npm 11
        shell: bash
        run: |
          npm install -g npm@11
          echo "node $(node -v) / npm $(npm -v)"

      - name: Clone and build presonus-studiolive-api
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone https://github.com/featherbear/presonus-studiolive-api.git
          cd presonus-studiolive-api && npm install && npm run build

      - name: Install app dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare dependency for electron-builder
        run: |
          DEPS_DIR="$GITHUB_WORKSPACE/../presonus-studiolive-api"
          rm -rf node_modules/presonus-studiolive-api
          mkdir -p node_modules/presonus-studiolive-api
          cp -r "$DEPS_DIR/dist" node_modules/presonus-studiolive-api/
          cp "$DEPS_DIR/package.json" node_modules/presonus-studiolive-api/
          [ -d "$DEPS_DIR/node_modules" ] && cp -r "$DEPS_DIR/node_modules" node_modules/presonus-studiolive-api/ || true

      - name: Build macOS packages
        id: build_mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # -p never disables electron-builder auto-publish (uploads are
          # handled by softprops/action-gh-release below); without this it
          # demands GH_TOKEN whenever a tag is present.
          if [ -n "$CSC_LINK" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            NODE_OPTIONS=--max-old-space-size=8192 npx electron-builder --mac -p never
          else
            # An *empty* CSC_LINK is not the same as an unset one: electron-builder
            # treats the empty string as a certificate path and dies with
            # "<workspace> not a file", which is why every build-mac run has
            # failed. Clear the signing variables outright before building.
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing credentials — building unsigned (artifacts will NOT be uploaded)"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false NODE_OPTIONS=--max-old-space-size=8192 \
              npx electron-builder --mac -p never \
                --config.mac.identity=null \
                --config.mac.notarize=false \
                --config.mac.hardenedRuntime=false
          fi

      # Only publish macOS artifacts when they are actually signed. An unsigned
      # DMG is blocked by Gatekeeper and must not reach users — `make release`
      # guards against exactly this locally. When the repo has no signing
      # secrets the build above still runs, so a broken mac build fails CI, but
      # nothing unusable gets attached to the release.
      - name: Upload macOS release assets
        if: steps.build_mac.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.dmg
            release/*-mac.zip

      - name: Note that macOS artifacts were skipped
        if: steps.build_mac.outputs.signed != 'true'
        run: |
          echo "::warning::macOS build succeeded but was unsigned, so no DMG/ZIP was attached." \
               "Add CSC_LINK / CSC_KEY_PASSWORD (and APPLE_* for notarization) to repository" \
               "secrets, or upload the signed artifacts from 'make release' manually."

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # node-gyp needs distutils to build @julusian/midi; Python 3.12+ removed it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Node 22 ships npm 10.9, whose resolver crashes with "Cannot read
      # properties of null (reading 'edgesOut')" on the upstream dependency
      # tree. This began failing both jobs after v1.4.2; npm 11 resolves it.
      - name: Use npm 11
        shell: bash
        run: |
          npm install -g npm@11
          echo "node $(node -v) / npm $(npm -v)"

      - name: Clone and build presonus-studiolive-api
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone https://github.com/featherbear/presonus-studiolive-api.git
          cd presonus-studiolive-api && npm install && npm run build

      - name: Install app dependencies
        run: npm install

      # npm scripts use Unix shell commands so we bypass npm run build
      # and replicate the steps directly through bash
      - name: Build TypeScript
        shell: bash
        run: npx tsc -p tsconfig.main.json

      - name: Copy assets
        shell: bash
        run: |
          mkdir -p dist/renderer
          cp src/renderer/index.html dist/renderer/
          node -e "const fs=require('fs'),p='dist/renderer/index.html',v=require('./package.json').version;fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/id=\"status-version\">[^<]*/,'id=\"status-version\">'+v))"
          mkdir -p dist/renderer/icons
          cp assets/icons/*.svg assets/icons/*.png dist/renderer/icons/ 2>/dev/null || true
          mkdir -p dist/assets
          cp assets/icon.icns assets/icon.png dist/assets/ 2>/dev/null || true

      - name: Prepare dependency for electron-builder
        shell: bash
        run: |
          DEPS_DIR="$GITHUB_WORKSPACE/../presonus-studiolive-api"
          rm -rf node_modules/presonus-studiolive-api
          mkdir -p node_modules/presonus-studiolive-api
          cp -r "$DEPS_DIR/dist" node_modules/presonus-studiolive-api/
          cp "$DEPS_DIR/package.json" node_modules/presonus-studiolive-api/
          [ -d "$DEPS_DIR/node_modules" ] && cp -r "$DEPS_DIR/node_modules" node_modules/presonus-studiolive-api/ || true

      - name: Build Windows packages
        run: npx electron-builder --win -p never
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
