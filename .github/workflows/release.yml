name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # node-gyp needs distutils to build @julusian/midi; Python 3.12+ removed it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # presonus-studiolive-api is a pinned git dependency that builds itself
      # via its `prepare` script. No sibling checkout, and no copying it into
      # node_modules for electron-builder — it is already a real directory.
      # This also means macOS and Windows build against identical code, which
      # was not true while the dependency was a local file: path.
      - name: Install app dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build macOS packages
        id: build_mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # -p never disables electron-builder auto-publish (uploads are
          # handled by softprops/action-gh-release below); without this it
          # demands GH_TOKEN whenever a tag is present.
          if [ -n "$CSC_LINK" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            NODE_OPTIONS=--max-old-space-size=8192 npx electron-builder --mac -p never
          else
            # An *empty* CSC_LINK is not the same as an unset one: electron-builder
            # treats the empty string as a certificate path and dies with
            # "<workspace> not a file", which is why every build-mac run has
            # failed. Clear the signing variables outright before building.
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing credentials — building unsigned (artifacts will NOT be uploaded)"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false NODE_OPTIONS=--max-old-space-size=8192 \
              npx electron-builder --mac -p never \
                --config.mac.identity=null \
                --config.mac.notarize=false \
                --config.mac.hardenedRuntime=false
          fi

      # Only publish macOS artifacts when they are actually signed. An unsigned
      # DMG is blocked by Gatekeeper and must not reach users — `make release`
      # guards against exactly this locally. When the repo has no signing
      # secrets the build above still runs, so a broken mac build fails CI, but
      # nothing unusable gets attached to the release.
      - name: Upload macOS release assets
        if: steps.build_mac.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.dmg
            release/*-mac.zip

      - name: Note that macOS artifacts were skipped
        if: steps.build_mac.outputs.signed != 'true'
        run: |
          echo "::warning::macOS build succeeded but was unsigned, so no DMG/ZIP was attached." \
               "Add CSC_LINK / CSC_KEY_PASSWORD (and APPLE_* for notarization) to repository" \
               "secrets, or upload the signed artifacts from 'make release' manually."

  build-win:
    # Pinned, not windows-latest: that label resolves to windows-2025-vs2026,
    # and the node-gyp bundled with @electron/rebuild for Electron 28 could not
    # detect Visual Studio 2026 — "Could not find any Visual Studio
    # installation to use" while rebuilding @julusian/midi.
    #
    # The Electron 43 upgrade probably carries a node-gyp that handles VS 2026,
    # but that is unverified: release.yml only runs on a tag, so trying it costs
    # a failed release. Left pinned deliberately; worth testing on a throwaway
    # tag before removing.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # node-gyp needs distutils to build @julusian/midi; Python 3.12+ removed it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install app dependencies
        run: npm ci

      # npm scripts use Unix shell commands so we bypass npm run build
      # and replicate the steps directly through bash
      - name: Build TypeScript
        shell: bash
        run: npx tsc -p tsconfig.main.json

      - name: Copy assets
        shell: bash
        run: |
          mkdir -p dist/renderer
          cp src/renderer/index.html dist/renderer/
          node -e "const fs=require('fs'),p='dist/renderer/index.html',v=require('./package.json').version;fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/id=\"status-version\">[^<]*/,'id=\"status-version\">'+v))"
          mkdir -p dist/renderer/icons
          cp assets/icons/*.svg assets/icons/*.png dist/renderer/icons/ 2>/dev/null || true
          mkdir -p dist/assets
          cp assets/icon.icns assets/icon.png dist/assets/ 2>/dev/null || true

      - name: Build Windows packages
        run: npx electron-builder --win -p never
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
