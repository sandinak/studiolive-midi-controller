name: CI

# release.yml only fires on v* tags and only builds packages, so nothing
# gated ordinary commits. This runs the type checker and the test suite on
# every push and pull request.
on:
  push:
    branches: ['**']
  pull_request:

# Least-privilege token: this workflow only reads the repo to typecheck and
# test. No write scopes are needed (release.yml handles publishing).
permissions:
  contents: read

jobs:
  test:
    # The suite used to run on Linux only, which meant macOS and Windows —
    # both of which the project ships — were never exercised by automation at
    # all. Windows in particular had shipped for several versions on the
    # strength of "it compiles".
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # node-gyp needs distutils to build @julusian/midi; Python 3.12+ removed it.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The pinned presonus-studiolive-api git dependency builds itself on
      # install and its build script shells out to yarn.
      - name: Ensure yarn is available
        run: corepack enable && yarn --version

      # presonus-studiolive-api is a pinned git dependency that builds itself
      # via its `prepare` script, so a plain install is all that's needed —
      # no sibling checkout, and the same code every platform builds against.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Enforces the coverage thresholds in jest.config.js. The integration
      # suite self-skips without MIXER_IP, which no runner has.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          retention-days: 14

  # A headless smoke test of the actual UI: boot the real renderer against the
  # fixture mixer in tools/screenshot/, drive every documented scene, and fail
  # if any of them stops rendering. Running it on all three platforms is what
  # catches rendering differences between them — the Linux system font is wider
  # than the macOS one, which silently truncated channel labels for a release.
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Electron pops a modal error box if the harness fails to load, which under
    # xvfb waits forever. Cap the job rather than burning a runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # libasound2-dev for @julusian/midi's build; the rest are the shared
      # libraries Electron itself needs on a bare runner. xvfb gives it a
      # display. macOS and Windows runners already have one.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2-dev libgtk-3-0 libnss3 libatk-bridge2.0-0 libgbm1

      - name: Ensure yarn is available
        run: corepack enable && yarn --version

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Capture UI screenshots (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" node tools/screenshot/run.js

      - name: Capture UI screenshots
        if: runner.os != 'Linux'
        run: node tools/screenshot/run.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: docs/images/*.png
          retention-days: 14
