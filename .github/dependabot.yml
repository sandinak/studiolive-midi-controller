version: 2

updates:
  # Until presonus-studiolive-api was pinned to a git tag, package.json used
  # `file:../presonus-studiolive-api`. Dependabot clones only this repository,
  # so it aborted at file-fetching every time — "path based dependencies could
  # not be retrieved" — and never opened a single PR, which is how 44 alerts
  # accumulated unnoticed. With the dependency resolvable from a URL it can run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Electron and electron-builder drag in most of the dependency tree
      # between them; grouping keeps one upgrade from becoming five PRs.
      electron:
        patterns:
          - electron
          - electron-builder
          - '@electron/*'
      types:
        patterns:
          - '@types/*'
      test-tooling:
        patterns:
          - jest
          - ts-jest
          - typescript
    ignore:
      # Pinned deliberately and updated by hand — bumping it changes what the
      # app is built against, which needs verification against real hardware.
      - dependency-name: presonus-studiolive-api
      # TypeScript 7 is the native (Go) compiler and does not expose the
      # JavaScript compiler API ts-jest builds on, so every test suite fails to
      # run under it — `tsc --noEmit` is fine, the test path is not. Adopting it
      # means carrying two TypeScript packages side by side (@typescript/native
      # for checking, a 6.x alias for ts-jest), which is a migration to plan,
      # not a dependency bump, and TypeScript never leaves the build machine.
      # Minor and patch updates still come through. Revisit when ts-jest
      # supports 7.x directly.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
